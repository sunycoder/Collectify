name: 问题反馈
description: 报告无法正常使用的情况
body:
  - type: textarea
    attributes:
      label: 遇到了什么问题？
      placeholder: 操作步骤、实际结果和期望结果，可附截图
    validations:
      required: true
  - type: input
    attributes:
      label: 主程序与插件版本
      placeholder: 如 Collectify 5.6.0，剪贴板历史 2.1.1
    validations:
      required: true
  - type: input
    attributes:
      label: 系统
      placeholder: 如 Windows 11 x64、macOS Apple Silicon
