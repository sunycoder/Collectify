name: 项目检查
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run plugins:check
      - run: npm run build:assets
      - name: 桌面回归检查
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Linux 桌面回归检查
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
