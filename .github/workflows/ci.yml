name: 项目检查
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run plugins:check
      - run: npm run build:assets
      - name: IP 查询可选插件回归
        if: runner.os != 'Linux'
        run: npm run smoke:ip-query
      - name: 计算稿纸可选插件回归
        if: runner.os != 'Linux'
        run: npm run smoke:calculator
      - name: 日历可选插件回归
        if: runner.os != 'Linux'
        run: npm run smoke:calendar
      - name: 桌面回归检查
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Linux 桌面回归检查
        if: runner.os == 'Linux'
        run: |
          npx install-electron --no
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm run smoke
          xvfb-run -a npm run smoke:ip-query
          xvfb-run -a npm run smoke:calculator
          xvfb-run -a npm run smoke:calendar
