name: 项目检查
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run defaults:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:contracts
      - run: npm test
      - run: npm run bench
      - uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.os }}
          path: dist/architecture-benchmark.json
          retention-days: 7
      - run: npm run plugins:check
      - run: npm run build:assets
      - name: IP 查询可选插件回归
        if: runner.os != 'Linux'
        run: npm run smoke:ip-query
      - name: 计算稿纸可选插件回归
        if: runner.os != 'Linux'
        run: npm run smoke:calculator
      - name: 日历可选插件回归
        if: runner.os != 'Linux'
        run: npm run smoke:calendar
      - name: Diff 可选插件回归
        if: runner.os != 'Linux'
        run: npm run smoke:diff
      - name: 桌面回归检查
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: 产品保护流程与退出回归
        if: runner.os != 'Linux'
        run: |
          npm run smoke -- --smoke-product
          npm run smoke -- --smoke-usability
          npm run smoke -- --smoke-architecture
          npm run smoke -- --smoke-default-plugins
          npm run smoke -- --smoke-shutdown
      - name: Linux 桌面回归检查
        if: runner.os == 'Linux'
        run: |
          npx install-electron --no
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm run smoke
          xvfb-run -a npm run smoke:ip-query
          xvfb-run -a npm run smoke:calculator
          xvfb-run -a npm run smoke:calendar
          xvfb-run -a npm run smoke:diff
          xvfb-run -a npm run smoke -- --smoke-product
          xvfb-run -a npm run smoke -- --smoke-usability
          xvfb-run -a npm run smoke -- --smoke-architecture
          xvfb-run -a npm run smoke -- --smoke-default-plugins
          xvfb-run -a npm run smoke -- --smoke-shutdown
