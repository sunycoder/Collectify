<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';script-src 'self';style-src 'self';connect-src 'none';object-src 'none';base-uri 'none'">
    <title>登录资料卡</title>
    <link rel="stylesheet" href="login-helper.css">
</head>
<body>
<header><strong>登录资料卡</strong>
    <button id="close" title="收起">×</button>
</header>
<main><p id="site"></p>
    <div class="credential-row"><span>账号</span><input id="username" readonly>
        <button id="copy-user">复制</button>
    </div>
    <div class="credential-row"><span>密码</span><input id="password" readonly>
        <button id="copy-password">复制</button>
    </div>
    <p id="help">复制后粘贴到网页对应输入框。</p><small id="feedback" role="status"></small></main>
<script src="login-helper-ui.js"></script>
</body>
</html>
