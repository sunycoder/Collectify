<!doctype html>
<html lang="zh-CN">

        <title>剪贴板快捷按钮</title>
        <link rel="stylesheet" href="shortcut.css" />

        <div class="drag-ring" title="拖动边缘调整位置">

                    <path d="M9 12h6M9 16h5" />

            </button>
        </div>
        <script src="shortcut.js"></script>
