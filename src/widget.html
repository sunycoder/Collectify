<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'">
    <title>Collectify · 桌面待办</title>
    <link rel="stylesheet" href="vendor/tom-select.css">
    <link rel="stylesheet" href="vendor/flatpickr.css">
    <link rel="stylesheet" href="widget.css">
    <link rel="stylesheet" href="office-ui.css">
    <link rel="stylesheet" href="interaction-fixes.css">
    <link rel="stylesheet" href="widget-surface.css">
</head>
<body>
<header>
    <div><span class="dot"></span><strong>手边待办</strong></div>
    <div class="widget-actions">
        <button id="mode" title="切换置顶模式">置顶</button>
        <button id="open" title="打开主窗口">↗</button>
        <button id="hide" title="收起">×</button>
    </div>
</header>
<section>
    <div class="widget-heading">
        <div><span id="mode-description"></span>
            <h1 id="day-title">今天</h1></div>
        <span id="count"></span></div>
    <div class="date-row"><input id="date" type="date" aria-label="查询日期">
        <button id="all">全部</button>
        <button id="today">今天</button>
    </div>
    <p id="error" role="alert"></p>
    <div id="tasks"></div>
    <footer>与主窗口实时同步 · 拖动标题栏移动</footer>
</section>
<script src="vendor/tom-select.js"></script>
<script src="vendor/flatpickr.js"></script>
<script src="vendor/flatpickr-zh.js"></script>
<script src="vendor/floating-ui.js"></script>
<script src="overlay.js"></script>
<script src="theme.js"></script>
<script src="widget.js"></script>
<script src="ui-components.js"></script>
</body>
</html>
